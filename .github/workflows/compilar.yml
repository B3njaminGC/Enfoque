name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilar
        run: gradle assembleRelease --stacktrace

      - name: Nombrar el APK
        run: cp app/build/outputs/apk/release/*.apk Enfoque.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Enfoque-APK
          path: Enfoque.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Enfoque (versión ${{ github.run_number }})
          body: |
            APK listo para instalar en el celu: tocá **Enfoque.apk** acá abajo.
            Cambio: ${{ github.event.head_commit.message }}
          files: Enfoque.apk
          make_latest: true
